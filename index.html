<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slovenské slovesá - Procvičovanie</title>
    <style>
        :root {
            --primary: #3A7BD5;
            --secondary: #00D2FF;
            --bg-color: #F0F4F8;
            --panel-bg: #FFFFFF;
            --text-color: #2C3E50;
            --success: #2ECC71;
            --danger: #E74C3C;
            --border: #DCDFE6;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 300px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            flex-shrink: 0;
        }

        .sidebar h2 {
            font-size: 1.2rem;
            color: var(--primary);
            margin: 0 0 10px 0;
            border-bottom: 2px solid var(--secondary);
            padding-bottom: 5px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 600;
            font-size: 0.9rem;
        }

        select, input[type="checkbox"] {
            cursor: pointer;
        }

        select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 0.95rem;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .btn-sidebar {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-sidebar:hover {
            opacity: 0.9;
        }

        .btn-danger { background: var(--danger); }
        .btn-success { background: var(--success); }

        /* Main Area Styles */
        .main-content {
            flex-grow: 1;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            color: var(--primary);
            font-size: 1.8rem;
        }

        /* Keyboard Styles */
        .keyboard-container {
            background: var(--panel-bg);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            text-align: center;
            max-width: 800px;
            width: 100%;
        }

        .keyboard-title {
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 6px;
            color: #7F8C8D;
        }

        .keys-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
        }

        .key-btn {
            background: #EAECEE;
            border: 1px solid #BDC3C7;
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: background 0.1s;
        }

        .key-btn:hover {
            background: var(--primary);
            color: white;
        }

        /* Dynamic Grid Layouts */
        .grid-container {
            display: grid;
            gap: 15px;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 25px;
        }

        .grid-cols-1 {
            grid-template-columns: minmax(300px, 500px);
            justify-content: center;
        }

        .grid-cols-2 {
            grid-template-columns: repeat(2, 1fr);
        }

        .grid-cols-3 {
            grid-template-columns: repeat(3, 1fr);
        }

        /* Card Styles */
        .card {
            background: var(--panel-bg);
            border-radius: 10px;
            padding: 15px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card p {
            margin: 0 0 10px 0;
            font-size: 1rem;
            line-height: 1.4;
        }

        .card-title {
            font-weight: bold;
            color: var(--primary);
        }

        .input-field {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: var(--primary);
        }

        .feedback-msg {
            font-size: 0.85rem;
            margin-top: 6px;
            font-weight: bold;
            min-height: 18px;
        }

        /* Correct/Incorrect State */
        .correct-input { border-color: var(--success) !important; background-color: #E8F8F5; }
        .incorrect-input { border-color: var(--danger) !important; background-color: #FDEDEC; }
        .correct-msg { color: var(--success); }
        .incorrect-msg { color: var(--danger); }

        /* Modal / Stats Display */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            max-width: 450px;
            width: 90%;
            text-align: center;
        }

        @media (max-width: 900px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; }
            .grid-cols-2, .grid-cols-3 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- LEFT SIDEBAR -->
    <div class="sidebar">
        <h2>⚙️ Nastavenia</h2>

        <div class="form-group">
            <label for="level-select">Úroveň (Level):</label>
            <select id="level-select" onchange="initTask()">
                <option value="1">1. Úroveň poznávania (Vzory)</option>
                <option value="2" selected>2. Úroveň aplikácie (Časovanie)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="count-select">Počet úloh:</label>
            <select id="count-select" onchange="initTask()">
                <option value="5">5 úloh (1 stĺpec)</option>
                <option value="10" selected>10 úloh (2 stĺpce)</option>
                <option value="15">15 úloh (3 stĺpce)</option>
            </select>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="exceptions-toggle" checked onchange="initTask()">
            <label for="exceptions-toggle">Zahrnúť výnimky</label>
        </div>

        <button class="btn-sidebar btn-success" onclick="checkAnswers()">Skontrolovať ✨</button>
        <button class="btn-sidebar" onclick="initTask()">Nové úlohy 🔄</button>

        <h2 style="margin-top: 15px;">📊 Štatistika</h2>
        <button class="btn-sidebar" onclick="showStatsModal()">Zobraziť štatistiku 📈</button>
        <button class="btn-sidebar" onclick="downloadStats()">Stiahnuť štatistiku 💾</button>
        <button class="btn-sidebar btn-danger" onclick="resetStats()">Vymazať štatistiku 🗑️</button>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div class="header">
            <h1>Slovenské slovesá</h1>
            <p id="level-description">Doplň slovesá v správnom tvare prítomného času.</p>
        </div>

        <!-- VIRTUAL KEYBOARD -->
        <div class="keyboard-container" id="virtual-keyboard">
            <div class="keyboard-title">Slovenská klávesnica (Klikni pre vloženie znakov)</div>
            <div class="keys-row">
                <button class="key-btn" onclick="insertChar('á')">á</button>
                <button class="key-btn" onclick="insertChar('ä')">ä</button>
                <button class="key-btn" onclick="insertChar('č')">č</button>
                <button class="key-btn" onclick="insertChar('ď')">ď</button>
                <button class="key-btn" onclick="insertChar('é')">é</button>
                <button class="key-btn" onclick="insertChar('í')">í</button>
                <button class="key-btn" onclick="insertChar('ĺ')">ĺ</button>
                <button class="key-btn" onclick="insertChar('ľ')">ľ</button>
                <button class="key-btn" onclick="insertChar('ň')">ň</button>
                <button class="key-btn" onclick="insertChar('ó')">ó</button>
                <button class="key-btn" onclick="insertChar('ô')">ô</button>
                <button class="key-btn" onclick="insertChar('ŕ')">ŕ</button>
                <button class="key-btn" onclick="insertChar('š')">š</button>
                <button class="key-btn" onclick="insertChar('ť')">ť</button>
                <button class="key-btn" onclick="insertChar('ú')">ú</button>
                <button class="key-btn" onclick="insertChar('ý')">ý</button>
                <button class="key-btn" onclick="insertChar('ž')">ž</button>
            </div>
        </div>

        <!-- TASK GRID -->
        <div id="grid-container" class="grid-container grid-cols-2"></div>
    </div>

    <!-- STATS MODAL -->
    <div class="modal" id="stats-modal">
        <div class="modal-content">
            <h2>📈 Celková Štatistika</h2>
            <p id="stats-info" style="font-size: 1.1rem; line-height: 1.6;"></p>
            <button class="btn-sidebar" onclick="closeStatsModal()">Zatvoriť</button>
        </div>
    </div>

<script>
// --- ADATBÁZIS ---
const verbPatterns = {
    1: { name: "POTREBOVAŤ (-ova-)", isException: false, verbs: ["bicyklovať sa", "boxovať", "cestovať", "ďakovať", "existovať", "fungovať", "gratulovať", "gumovať", "havarovať", "korčuľovať sa", "kritizovať", "lyžovať sa", "maľovať", "milovať", "nakupovať", "nastupovať", "obedovať", "odpisovať", "otravovať", "parkovať", "pilotovať", "pracovať", "predstavovať si", "raňajkovať", "reagovať", "recitovať", "relaxovať", "rýľovať", "sánkovať sa", "sľubovať", "šoférovať", "sprchovať sa", "sťažovať sa", "tancovať", "telefonovať", "ukazovať", "upratovať", "vtipkovať", "vyfarbovať", "vystupovať", "vysvetľovať"] },
    2: { name: "HOVORIŤ (-i-)", isException: false, verbs: ["baliť", "chodiť", "chrániť", "chváliť", "cítiť sa", "cvičiť", "dovoliť", "hanbiť sa", "hlásiť sa", "kaziť", "končiť sa", "kosiť", "kresliť", "kŕmiť", "liečiť", "lúčiť sa", "lúštiť", "meniť sa", "mýliť sa", "narodiť sa", "nosiť", "nudiť sa", "páčiť sa", "robiť", "sadiť", "snežiť", "strážiť", "súhlasiť", "súťažiť", "svietiť", "tešiť sa", "tlačiť", "točiť sa", "topiť sa", "učiť sa", "učiť", "variť", "zdobiť", "zdraviť sa"] },
    3: { name: "PIŤ (pozor na vzor)", isException: true, verbs: ["žiť", "piť", "počuť", "biť sa", "umyť"] },
    4: { name: "MUSIEŤ (-ie-)", isException: false, verbs: ["bolieť", "horieť", "letieť", "myslieť", "sedieť", "smrdieť", "vidieť", "visieť"] },
    5: { name: "ROZUMIEŤ (výnimka)", isException: true, verbs: ["utrieť", "pozrieť sa", "rozprestrieť"] },
    6: { name: "KRIČAŤ (výnimka)", isException: true, verbs: ["držať", "ležať", "pršať", "spať", "kričať", "bežať"] },
    7: { name: "KLAMAŤ (výnimka)", isException: true, verbs: ["česať sa", "frflať", "hádzať", "hrabať", "hýbať sa", "kašľať", "klamať", "kopať", "kúpať sa", "lízať", "písať", "plakať", "skákať", "škrabať sa", "chápať", "štvať", "rehotať sa"] },
    8: { name: "MAŤ (-a-)", isException: false, verbs: ["behať", "blýskať sa", "búchať", "bývať", "čakať", "červenať sa", "chytať", "čítať", "dávať", "dostávať", "dvíhať", "fúkať", "hádať sa", "hľadať", "hladkať", "hnevať sa", "hojdať sa", "hrať sa", "krájať", "krvácať", "kýchať", "lietať", "mávať", "meškať", "neznášať", "oberať", "obzerať sa", "odchádzať", "odpočívať", "opekať", "odpovedať", "okopávať", "opierať sa", "otvárať", "padať", "pamätať si", "plávať", "počítať", "počúvať", "polievať", "podobať sa", "pomáhať", "ponáhľať sa", "posielať", "poslúchať", "používať", "pozerať", "poznať", "pozývať", "prichádzať", "pýtať sa", "rozmýšľať", "rozprávať", "šepkať", "šmýkať sa", "snívať", "spievať", "spoznávať", "starať sa o", "ťahať", "trhať", "umývať", "usmievať sa", "utekať", "utierať", "volať sa", "vstávať", "vyhrávať", "vysávať", "zabávať sa", "začínať sa", "zametať", "zatvárať", "zbierať", "žmurkať", "obliekať sa", "stávať", "večerať", "stmievať sa", "schovávať sa", "voňať"] },
    9: { name: "KRADNÚŤ (-nú-)", isException: false, verbs: ["chudnúť", "kradnúť", "starnúť", "mladnúť", "žltnúť", "hnednúť"] }
};

const sentencesDatabase = [
    { template: "Deti sa radostne {v} na rozprávke.", verb: "rehotať sa", ans: "rehocú sa", exc: true },
    { template: "Mama po večeri stôl rýchlo {v}.", verb: "utrieť", ans: "utrie", exc: true },
    { template: "Môj starý otec rád {v} pri stole.", verb: "večerať", ans: "večeria", exc: false },
    { template: "V záhrade krásne {v} kvety.", verb: "voňať", ans: "voňajú", exc: false },
    { template: "Chlapci na dvore rýchlo {v} za loptou.", verb: "utekať", ans: "utekajú", exc: false },
    { template: "Oni sa na mňa pozorne {v}.", verb: "pozrieť sa", ans: "pozrú sa", exc: true },
    { template: "Žiaci usilovne {v} novú gramatiku.", verb: "učiť sa", ans: "učia sa", exc: false },
    { template: "Vtáky na jeseň {v} do teplých krajín.", verb: "letieť", ans: "letia", exc: false },
    { template: "Sestra si pred zrkadlom vlasy {v}.", verb: "česať sa", ans: "češe", exc: true },
    { template: "Ja rád {v} knihu pred spaním.", verb: "čítať", ans: "čítam", exc: false },
    { template: "Rodičia {v} v obchode nový nábytok.", verb: "nakupovať", ans: "nakupujú", exc: false },
    { template: "V zime sa deti často {v} na kopci.", verb: "sánkovať sa", ans: "sánkujú sa", exc: false },
    { template: "Učiteľ {v} novú úlohu na tabuľu.", verb: "písať", ans: "píše", exc: true },
    { template: "Slnko svieti a sneh sa rýchlo {v}.", verb: "topiť sa", ans: "topí sa", exc: false },
    { template: "Bábätko v postieľke sladko {v}.", verb: "spať", ans: "spí", exc: true }
];

let currentTasks = [];
let activeInput = null;

// --- BILLENTYŰZET KEZELÉS ---
document.addEventListener('focusin', (e) => {
    if (e.target.tagName === 'INPUT' && e.target.type === 'text') {
        activeInput = e.target;
    }
});

function insertChar(char) {
    if (!activeInput) return;
    const start = activeInput.selectionStart;
    const end = activeInput.selectionEnd;
    const text = activeInput.value;
    activeInput.value = text.substring(0, start) + char + text.substring(end);
    activeInput.focus();
    activeInput.setSelectionRange(start + 1, start + 1);
}

// --- GENERÁLÁS ÉS MEGJELENÍTÉS ---
function initTask() {
    const level = document.getElementById('level-select').value;
    const count = parseInt(document.getElementById('count-select').value);
    const useExceptions = document.getElementById('exceptions-toggle').checked;
    
    const container = document.getElementById('grid-container');
    const desc = document.getElementById('level-description');
    
    // Grid oszlopok beállítása
    container.className = 'grid-container ' + (count === 5 ? 'grid-cols-1' : count === 10 ? 'grid-cols-2' : 'grid-cols-3');
    container.innerHTML = '';
    currentTasks = [];

    if (level === "1") {
        desc.innerText = "Urči správny časovací vzor pre dané sloveso.";
        document.getElementById('virtual-keyboard').style.display = 'none';
        generateLevel1(count, useExceptions);
    } else {
        desc.innerText = "Doplň sloveso v zátvorke v správnom tvare prítomného času.";
        document.getElementById('virtual-keyboard').style.display = 'block';
        generateLevel2(count, useExceptions);
    }
}

function generateLevel1(count, useExceptions) {
    let pool = [];
    Object.keys(verbPatterns).forEach(pKey => {
        const pattern = verbPatterns[pKey];
        if (!useExceptions && pattern.isException) return;
        pattern.verbs.forEach(v => {
            pool.push({ verb: v, correctPattern: pKey });
        });
    });

    pool.sort(() => Math.random() - 0.5);
    currentTasks = pool.slice(0, count);

    const container = document.getElementById('grid-container');
    currentTasks.forEach((task, idx) => {
        let options = `<option value="">-- Vyber vzor --</option>`;
        Object.keys(verbPatterns).forEach(pKey => {
            options += `<option value="${pKey}">${pKey}. Vzor ${verbPatterns[pKey].name}</option>`;
        });

        container.innerHTML += `
            <div class="card">
                <p>${idx + 1}. Sloveso: <span class="card-title">${task.verb}</span></p>
                <select id="input-${idx}">${options}</select>
                <div id="fb-${idx}" class="feedback-msg"></div>
            </div>
        `;
    });
}

function generateLevel2(count, useExceptions) {
    let pool = sentencesDatabase.filter(s => useExceptions || !s.exc);
    pool.sort(() => Math.random() - 0.5);
    
    // Ha nincs elég mondat az adatbázisban a szűrés után, ismétlődést engedélyez
    while (pool.length < count) {
        pool = pool.concat(pool);
    }
    currentTasks = pool.slice(0, count);

    const container = document.getElementById('grid-container');
    currentTasks.forEach((task, idx) => {
        const parts = task.template.split('{v}');
        container.innerHTML += `
            <div class="card">
                <p>${idx + 1}. ${parts[0]} <strong>(${task.verb})</strong> ${parts[1]}</p>
                <input type="text" id="input-${idx}" class="input-field" placeholder="odpoveď..." autocomplete="off">
                <div id="fb-${idx}" class="feedback-msg"></div>
            </div>
        `;
    });
}

// --- ELLENŐRZÉS ÉS STATISZTIKA ---
function checkAnswers() {
    const level = document.getElementById('level-select').value;
    let correctCount = 0;

    currentTasks.forEach((task, idx) => {
        const inputElem = document.getElementById(`input-${idx}`);
        const fbElem = document.getElementById(`fb-${idx}`);
        const userAns = inputElem.value.trim().toLowerCase();

        inputElem.classList.remove('correct-input', 'incorrect-input');
        
        let isCorrect = false;
        let expected = "";

        if (level === "1") {
            isCorrect = (userAns === task.correctPattern);
            expected = `${task.correctPattern}. Vzor ${verbPatterns[task.correctPattern].name}`;
        } else {
            isCorrect = (userAns === task.ans.toLowerCase());
            expected = task.ans;
        }

        if (isCorrect) {
            correctCount++;
            inputElem.classList.add('correct-input');
            fbElem.className = "feedback-msg correct-msg";
            fbElem.innerText = "✓ Správne";
        } else {
            inputElem.classList.add('incorrect-input');
            fbElem.className = "feedback-msg incorrect-msg";
            fbElem.innerText = `✗ Správne: ${expected}`;
        }
    });

    saveStats(correctCount, currentTasks.length);
}

function saveStats(correct, total) {
    let stats = JSON.parse(localStorage.getItem('verb_stats') || '{"correct": 0, "total": 0, "sessions": 0}');
    stats.correct += correct;
    stats.total += total;
    stats.sessions += 1;
    localStorage.setItem('verb_stats', JSON.stringify(stats));
}

function showStatsModal() {
    let stats = JSON.parse(localStorage.getItem('verb_stats') || '{"correct": 0, "total": 0, "sessions": 0}');
    const percent = stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) : 0;
    
    document.getElementById('stats-info').innerHTML = `
        Počet dokončených sérií: <strong>${stats.sessions}</strong><br>
        Správne odpovede: <strong>${stats.correct} / ${stats.total}</strong><br>
        Úspešnosť: <strong>${percent}%</strong>
    `;
    document.getElementById('stats-modal').style.display = 'flex';
}

function closeStatsModal() {
    document.getElementById('stats-modal').style.display = 'none';
}

function resetStats() {
    if (confirm("Naozaj chceš vymazať všetky štatistiky?")) {
        localStorage.removeItem('verb_stats');
        alert("Štatistika bola vymazaná.");
    }
}

function downloadStats() {
    let stats = JSON.parse(localStorage.getItem('verb_stats') || '{"correct": 0, "total": 0, "sessions": 0}');
    const percent = stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) : 0;
    
    const content = `ŠTATISTIKA - SLOVENSKÉ SLOVESÁ\n` +
                    `----------------------------\n` +
                    `Počet sérií: ${stats.sessions}\n` +
                    `Správne odpovede: ${stats.correct}\n` +
                    `Celkovo otázok: ${stats.total}\n` +
                    `Úspešnosť: ${percent}%\n` +
                    `Dátum: ${new Date().toLocaleDateString('sk-SK')}`;

    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'statistika_slovesa.txt';
    a.click();
}

// Spustenie pri načítaní
window.onload = initTask;
</script>
</body>
</html>
